name: Release

# Publish to npm when a Git tag matching v*.*.* is pushed. Maintainers
# create the tag locally (or via the GitHub release UI); this workflow
# verifies the package, builds, and publishes.
#
# Required repository secret: NPM_TOKEN — an npm automation token with
# publish rights to the `copilot-trace-importer` package.
#
# Pre-flight expected of the maintainer before tagging:
#   1. Bump `package.json#version`.
#   2. Move the relevant `## [Unreleased]` block in CHANGELOG.md under
#      a new `## [<version>] — <YYYY-MM-DD>` heading.
#   3. Open a release PR, merge it, then `git tag vX.Y.Z` on the
#      merged commit and push the tag.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write  # for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install SQLite (needed by the test suite)
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
